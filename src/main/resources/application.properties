spring.application.name=streetsafe
server.port=8080

# ---- MySQL Configuration ----
spring.datasource.url=jdbc:mysql://localhost:3306/streetsafe_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- Hibernate / JPA ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# ---- Seed Data ----
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# ---- Thymeleaf ----
spring.thymeleaf.cache=false
streetsafe.public-base-url=http://192.168.137.1:8080