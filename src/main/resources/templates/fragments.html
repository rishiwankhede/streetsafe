<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b5a2a">
    <title th:text="${title}">StreetSafe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&amp;family=Hind:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/streetsafe.css}">
</head>

<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark ss-navbar sticky-top">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}"><i class="bi bi-patch-check-fill me-1"></i>StreetSafe</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#ssNav"
                aria-controls="ssNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="ssNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/#stalls}">All stalls</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/#how}">How it works</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Five icons; the first n are filled -->
<span th:fragment="stars(n)" class="ss-stars" aria-hidden="true">
    <i th:each="i : ${#numbers.sequence(1, 5)}" class="bi" th:classappend="${i le n} ? 'bi-star-fill' : 'bi-star'"></i>
</span>

<!-- Star breakdown bars -->
<div th:fragment="breakdown(bars)">
    <div class="d-flex align-items-center gap-2 mb-1" th:each="b : ${bars}">
        <span class="small fw-semibold text-nowrap" style="width:2.2rem" th:text="${b.star} + ' ★'">5 ★</span>
        <div class="progress flex-grow-1" style="height:9px" role="progressbar"
             th:aria-label="${b.star} + ' star reviews'" th:aria-valuenow="${b.percent}" aria-valuemin="0" aria-valuemax="100">
            <div class="progress-bar ss-bar" th:style="|width:${b.percent}%|"></div>
        </div>
        <span class="small text-muted text-end" style="width:1.8rem" th:text="${b.count}">0</span>
    </div>
</div>

<footer th:fragment="footer" class="py-4 mt-5 border-top bg-white">
    <div class="container small text-muted d-flex flex-wrap justify-content-between gap-2">
        <span><i class="bi bi-patch-check-fill text-success"></i> StreetSafe &ndash; a street food trust &amp; hygiene platform</span>
        <span>Built with Spring Boot, MySQL, Thymeleaf &amp; ZXing</span>
    </div>
</footer>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
